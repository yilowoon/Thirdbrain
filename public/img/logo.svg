<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="ThirdBrain">
  <title>ThirdBrain</title>
  <desc>맞물린 두 원과 그 겹침에서 생기는 렌즈. 둘이 만날 때 비로소 생기는 제3의 공간을 뜻한다.</desc>
  <defs>
    <linearGradient id="tb-ring" x1="6" y1="11" x2="42" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#8f7139"/>
      <stop offset="52%"  stop-color="#c59b49"/>
      <stop offset="100%" stop-color="#ffc75a"/>
    </linearGradient>
    <linearGradient id="tb-lens" x1="24" y1="11" x2="24" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffc75a" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#8f7139" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <!-- 겹침에서 생기는 렌즈 = 제3의 공간 -->
  <path d="M24,12 A13,13 0 0 1 24,36 A13,13 0 0 1 24,12 Z" fill="url(#tb-lens)"/>

  <!-- 맞물린 두 원 -->
  <circle cx="19" cy="24" r="13" fill="none" stroke="url(#tb-ring)" stroke-width="2"/>
  <circle cx="29" cy="24" r="13" fill="none" stroke="url(#tb-ring)" stroke-width="2"/>

  <!-- 수렴점 -->
  <circle cx="24" cy="24" r="3" fill="#ffc75a"/>
</svg>
