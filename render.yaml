# Render 배포 블루프린트
#
# 이 저장소를 Render 에 연결하면 아래 정의대로 웹 서비스가 뜬다.
#   https://dashboard.render.com/blueprints  →  New Blueprint Instance
#
# 의존성이 없으므로 빌드 단계가 사실상 비어 있고, 시작만 하면 된다.
#
# READ_ONLY=true
#   공개 URL 이므로 쓰기(신규 정책·시민 신호 입력)를 잠근다.
#   누구나 접근할 수 있는 주소에서 아무나 데이터를 밀어 넣게 두지 않기 위해서다.
#   대조(analyze)는 열려 있어 화면에서 연결 지점 확인까지는 그대로 된다.
#   입력이 필요하면 로컬에서 `node server.js` 로 띄워 쓰면 된다.
#
# 무료 플랜의 제약 두 가지
#   · 15분 무접속이면 잠들고, 다음 요청에서 30~60초 정도 깨어나는 시간이 걸린다.
#   · 파일시스템이 휘발성이라 재시작하면 data/*.json 변경분이 사라진다.
#     쓰기를 살리려면 유료 플랜 + 디스크를 /opt/render/project/src/data 에 붙여야 한다.

services:
  - type: web
    name: thirdbrain
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/graph
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: READ_ONLY
        value: "true"
